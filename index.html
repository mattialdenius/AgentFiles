<!--
  =====================================================================
  AGENT FILES – Englisch-Informationslücken-Spiel (Realschule BW)
  =====================================================================
  Version: v0.1.2
  Autor:   M. Aldenius (mit Claude)

  Änderungsliste
  --------------
  v0.1.2 (25.11.2026) – Rückmeldung aus dem Praxistest
    - Alarm-Sperre als schmale Leiste oben statt Fenster in der Mitte:
      das Bild bleibt sichtbar, damit die Schüler nachfragen können
  v0.1.1 (25.11.2026) – Rückmeldungen aus dem ersten Test
    - Fehler behoben: Ziffern im Funkcode-Feld waren unsichtbar
    - Aufgabentext größer und deutlicher (Kasten „Auftrag“)
    - Raten begrenzt: Zimmer 2 / Schulhof 1 Fehlversuch, danach
      „Alarm“ mit 30 Sekunden Sperre
  v0.1.0 (25.11.2026) – Erster Prototyp (Phase 1)
    - Startbildschirm im Comic-Design (Klassen-Drehschloss, Rollen
      Field Agents / HQ, Ampel mit Sternen, Missionsnummer)
    - Kopplung zweier iPads OHNE Internet über die Missionsnummer
    - Klasse 5: Trainingsmission + Mission 1 „The Lost Hamster“
      (Türschild/Passwort, Zimmer-Unterschiede, Kind auf dem Schulhof,
      Finale mit Gesamtcode)
    - Funkcodes zwischen den Stationen, Erklärung bei Fehlern,
      Funk-Knopf mit Redemitteln und Wörterhilfe

  Aufbau
  ------
  index.html          = Technik + Design (diese Datei)
  daten/klasse5.js    = Inhalte Klasse 5 (Texte, Wörter, Lösungsbausteine)

  Datenschutz: Es wird nichts gespeichert und nichts übertragen.
  Kein localStorage, keine Cookies, keine externen Dateien.
  =====================================================================
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Agent Files</title>
<style>
/* ===================== FARBEN & SCHRIFTEN ===================== */
:root{
  --navy:#0B2D5B; --navy-dunkel:#0b1a33; --gelb:#F4C430; --koralle:#E85D3A;
  --tuerkis:#2FB7B3; --papier:#F7F1E3; --gruen:#3FA34D; --holz:#8A5A2E;
  --akte:#E9CF96; --geraet:#3a4c66;
  --f-titel:"Avenir Next Condensed","AvenirNextCondensed-Heavy","Arial Narrow",Impact,"Helvetica Neue",sans-serif;
  --f-text:"Avenir Next","Helvetica Neue",Arial,sans-serif;
  --f-schreibmaschine:"American Typewriter","Courier New",monospace;
  --f-hand:"Marker Felt","Chalkboard SE","Comic Sans MS",cursive;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:var(--f-text);color:var(--navy-dunkel);
  background-color:var(--navy);
  background-image:
    radial-gradient(rgba(255,255,255,.07) 1.6px, transparent 1.8px),
    repeating-conic-gradient(from 0deg at 50% 35%, #0f3a73 0deg 7deg, var(--navy) 7deg 14deg);
  background-size:14px 14px, 100% 100%;
  background-attachment:fixed;
  touch-action:manipulation;user-select:none;-webkit-user-select:none;
  min-height:100%;
}
body.hq{
  background-color:#7a4c25;
  background-image:
    repeating-linear-gradient(90deg, rgba(0,0,0,.06) 0 3px, transparent 3px 90px),
    repeating-linear-gradient(0deg, #8A5A2E 0 38px, #7f5228 38px 40px, #93633a 40px 78px, #7f5228 78px 80px);
  background-size:auto;
}
#app{max-width:1100px;margin:0 auto;padding:14px 14px 110px;min-height:100vh}
.titel{font-family:var(--f-titel);font-weight:900;text-transform:uppercase;letter-spacing:.02em}
footer{position:fixed;left:0;right:0;bottom:0;text-align:center;font-size:.75rem;color:rgba(255,255,255,.75);padding:4px;pointer-events:none}
body.hq footer{color:rgba(255,240,210,.85)}

/* ===================== KNÖPFE ===================== */
.knopf{
  font-family:var(--f-titel);font-weight:900;text-transform:uppercase;
  font-size:1.35rem;padding:.55em 1.2em;min-height:60px;
  border:3px solid var(--navy-dunkel);border-radius:18px;cursor:pointer;
  background:var(--gelb);color:var(--navy-dunkel);
  box-shadow:0 5px 0 var(--navy-dunkel);transition:transform .05s;
}
.knopf:active{transform:translateY(4px);box-shadow:0 1px 0 var(--navy-dunkel)}
.knopf.navy{background:var(--navy);color:#fff}
.knopf.koralle{background:var(--koralle);color:#fff}
.knopf.tuerkis{background:var(--tuerkis);color:#fff}
.knopf.papier{background:var(--papier)}
.knopf:disabled{opacity:.45}
.knopfreihe{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:14px}

/* ===================== KARTEN ===================== */
.karte{background:var(--papier);border:3px solid var(--navy-dunkel);border-radius:18px;
  box-shadow:0 6px 0 var(--navy-dunkel);padding:16px}
.karte.gelbrand{outline:5px solid var(--gelb);outline-offset:-10px}
.hinweis{font-size:1.05rem;line-height:1.4}
.de{font-size:1rem;color:#33425a;line-height:1.35}

/* ===================== START ===================== */
.logo{display:flex;flex-direction:column;align-items:center;margin:4px 0 14px}
.logo-band{background:var(--gelb);border:4px solid var(--navy-dunkel);border-radius:10px;
  padding:4px 26px;transform:rotate(-2deg);box-shadow:0 6px 0 var(--navy-dunkel);display:flex;align-items:center;gap:10px}
.logo-band span{font-family:var(--f-titel);font-weight:900;font-size:clamp(2.4rem,7vw,4.4rem);color:var(--navy);line-height:1}
.logo-unter{background:var(--papier);border:3px solid var(--navy-dunkel);padding:2px 18px;margin-top:-4px;transform:rotate(-2deg);
  font-family:var(--f-titel);font-weight:900;font-size:1.3rem}
.startreihe{display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:center}
@media (max-width:700px){.startreihe{grid-template-columns:1fr 1fr}.startreihe .schloss-box{grid-column:1/3;order:-1}}
.rolle{cursor:pointer;text-align:center;padding:14px;min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.rolle:active{transform:translateY(4px);box-shadow:0 2px 0 var(--navy-dunkel)}
.rolle .titel{font-size:2rem;line-height:1}
.rolle svg{width:120px;height:90px}
.schloss-box{display:flex;align-items:center;gap:8px;justify-content:center}
.pfeil{width:54px;height:54px;border-radius:50%;border:3px solid var(--navy-dunkel);background:var(--gelb);font-size:1.6rem;font-weight:900;cursor:pointer;box-shadow:0 4px 0 var(--navy-dunkel)}
.pfeil:active{transform:translateY(3px);box-shadow:0 1px 0 var(--navy-dunkel)}
.schloss{width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,#d7dde5 0 55%,#8f9bab 56% 62%,#d7dde5 63% 100%);
  border:5px solid var(--navy-dunkel);display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 6px 0 var(--navy-dunkel)}
.schloss::before{content:"";position:absolute;inset:12px;border-radius:50%;
  background:repeating-conic-gradient(var(--navy-dunkel) 0 1.2deg, transparent 1.2deg 15deg);
  -webkit-mask:radial-gradient(circle, transparent 0 62%, #000 63%);mask:radial-gradient(circle, transparent 0 62%, #000 63%)}
.schloss-innen{width:96px;height:96px;border-radius:50%;background:var(--navy);border:4px solid var(--navy-dunkel);
  display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--f-titel);font-weight:900;font-size:3.4rem}
.schloss-label{color:#fff;text-align:center;font-family:var(--f-titel);font-weight:900;margin-top:6px;font-size:1.1rem}
.leiste{margin-top:22px;background:rgba(11,26,51,.85);border:3px solid var(--navy-dunkel);border-radius:18px;padding:12px 18px;color:#fff;
  display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap}

/* Ampel mit Sternen */
.sterne{display:flex;gap:12px}
.stern-knopf{width:72px;height:72px;border-radius:50%;border:3px solid var(--navy-dunkel);cursor:pointer;
  box-shadow:0 4px 0 var(--navy-dunkel);color:#fff;font-size:1.25rem;line-height:1;opacity:.55}
.stern-knopf.an{opacity:1;outline:5px solid #fff;outline-offset:2px}
.stern-knopf.s0{background:var(--gruen)} .stern-knopf.s1{background:var(--gelb);color:var(--navy-dunkel)} .stern-knopf.s2{background:var(--koralle)}
.missionen{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.mission-karte{cursor:pointer;text-align:center}
.mission-karte.an{background:#fff4c9;outline:6px solid var(--gelb);outline-offset:-3px}
.mission-karte .titel{font-size:1.7rem}
.nummer{font-family:var(--f-titel);font-weight:900;font-size:clamp(4rem,14vw,7rem);background:var(--papier);color:var(--navy);
  border:4px solid var(--navy-dunkel);border-radius:16px;padding:0 .4em;letter-spacing:.08em;display:inline-block;box-shadow:0 6px 0 var(--navy-dunkel)}

/* ===================== STATIONEN ===================== */
.kopf{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.raus{width:48px;height:48px;border-radius:50%;border:3px solid var(--navy-dunkel);background:var(--papier);font-weight:900;font-size:1.3rem;cursor:pointer;flex:none}
.banner{flex:1;background:var(--gelb);border:3px solid var(--navy-dunkel);border-radius:10px;padding:6px 16px;
  font-family:var(--f-titel);font-weight:900;font-size:clamp(1.2rem,3.4vw,1.9rem);text-transform:uppercase;transform:rotate(-1deg);box-shadow:0 4px 0 var(--navy-dunkel)}
.sprecher{background:var(--navy);color:#fff;border:3px solid var(--navy-dunkel);border-radius:10px;padding:6px 10px;font-family:var(--f-titel);font-weight:900;font-size:1rem;flex:none}
body.hq .sprecher{background:var(--koralle)}
.aufgabe{background:#fff7d6;border:4px solid var(--navy-dunkel);border-left:14px solid var(--gelb);border-radius:14px;padding:12px 16px;margin-bottom:14px;font-size:clamp(1.25rem,2.6vw,1.5rem);font-weight:600;line-height:1.35;box-shadow:0 5px 0 var(--navy-dunkel)}
.aufgabe .marke{display:inline-block;background:var(--navy);color:#fff;border-radius:8px;padding:0 8px;margin-right:8px;font-family:var(--f-titel);font-weight:900;text-transform:uppercase;font-size:.85em}
.aufgabe b{font-family:var(--f-titel);text-transform:uppercase}

/* Agenten-Gerät (Field Agents) */
.geraet{position:relative;background:var(--geraet);border:4px solid var(--navy-dunkel);border-radius:34px;padding:26px 22px 22px 22px;
  box-shadow:inset 0 -10px 0 rgba(0,0,0,.25), inset 0 6px 0 rgba(255,255,255,.08), 0 8px 0 var(--navy-dunkel);margin-top:46px}
.geraet::before{content:"";position:absolute;top:-50px;left:46px;width:26px;height:56px;background:#22324a;border:4px solid var(--navy-dunkel);border-radius:10px 10px 0 0}
.geraet .lampe{position:absolute;top:-20px;left:50%;transform:translateX(-50%);width:66px;height:28px;border-radius:30px 30px 6px 6px;background:var(--koralle);border:4px solid var(--navy-dunkel);box-shadow:0 0 18px rgba(232,93,58,.8)}
.geraet .grill{position:absolute;left:8px;top:90px;width:10px;height:110px;border-radius:5px;background:repeating-linear-gradient(#1c2a40 0 8px,transparent 8px 16px)}
.schirm{background:var(--papier);border:4px solid var(--navy-dunkel);border-radius:20px;padding:14px;min-height:200px}

/* Akte (HQ) */
.akte{position:relative;background:var(--akte);border:4px solid var(--navy-dunkel);border-radius:10px 22px 22px 10px;padding:22px 18px 18px;
  box-shadow:0 8px 0 rgba(0,0,0,.35), inset 12px 0 0 #d8b978}
.akte::before{content:"";position:absolute;left:24px;top:-18px;width:34px;height:70px;border:5px solid #9aa3ad;border-radius:18px;border-bottom-color:transparent;transform:rotate(-8deg)}
.stempel{position:absolute;right:26px;top:-16px;z-index:2;border:4px solid var(--koralle);color:var(--koralle);font-family:var(--f-titel);font-weight:900;
  font-size:1.5rem;padding:0 10px;transform:rotate(-8deg);opacity:.9;background:rgba(255,255,255,.25)}
.papier{background:#fffdf6;border:2px solid #b9a77f;box-shadow:3px 4px 0 rgba(0,0,0,.18);padding:16px 18px;font-family:var(--f-schreibmaschine);font-size:1.15rem;line-height:1.5}
.papier h3{margin:0 0 8px;font-family:var(--f-schreibmaschine);text-decoration:underline}
.zettel{margin-top:26px;background:#ffe27a;border:2px solid #c9a52a;box-shadow:3px 4px 0 rgba(0,0,0,.2);padding:10px 14px;font-family:var(--f-hand);font-size:1.15rem;transform:rotate(1.5deg);line-height:1.45}
.zettel h4{margin:0 0 4px;font-family:var(--f-hand);font-size:1.25rem}
.zettel ul{margin:0;padding-left:18px}
.zweispaltig{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;align-items:start}
@media (max-width:760px){.zweispaltig{grid-template-columns:1fr}}
.liste-zeile{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed #b9a77f;padding:3px 0}
.foto{background:#fff;padding:10px 10px 30px;border:2px solid #cfc6b0;box-shadow:3px 5px 0 rgba(0,0,0,.25);transform:rotate(-1deg)}
.foto-unter{font-family:var(--f-hand);text-align:center;margin-top:4px;font-size:1.1rem}

/* Tastaturen */
.anzeige{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0 12px;min-height:56px}
.feld{width:44px;height:54px;border:3px solid var(--navy-dunkel);border-radius:8px;background:#fff;color:var(--navy-dunkel);font-family:var(--f-titel);font-weight:900;font-size:2rem;
  display:flex;align-items:center;justify-content:center}
.feld.aktiv{border-color:var(--koralle);box-shadow:0 0 0 3px rgba(232,93,58,.35)}
.feld.fest{border:none;background:none;width:18px}
.luecke{width:22px}
.tasten{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;max-width:620px;margin:0 auto}
.tasten.zahlen{grid-template-columns:repeat(5,1fr);max-width:420px}
.taste{min-height:58px;border:3px solid var(--navy-dunkel);border-radius:12px;background:var(--papier);font-family:var(--f-titel);font-weight:900;font-size:1.7rem;
  box-shadow:0 4px 0 var(--navy-dunkel);cursor:pointer;color:var(--navy-dunkel)}
.taste:active{transform:translateY(3px);box-shadow:0 1px 0 var(--navy-dunkel)}
.taste.ok{background:var(--tuerkis);color:#fff;grid-column:span 2}
.taste.weg{background:var(--koralle);color:#fff}

/* Funkcode-Feld (Empfänger) */
.funk-panel{margin-top:18px;background:var(--navy);color:#fff;border:3px solid var(--navy-dunkel);border-radius:18px;padding:12px 14px;box-shadow:0 6px 0 var(--navy-dunkel)}
.funk-panel .titel{font-size:1.4rem;text-align:center}
.funk-panel .de{color:#dfe7f3;text-align:center}
.funk-panel .taste{background:var(--papier)}
.funk-panel .taste.ok{background:var(--tuerkis)}
.funk-panel .taste.weg{background:var(--koralle)}

/* Erfolgsfeld (Löser) */
.erfolg{background:var(--papier);border:4px solid var(--navy-dunkel);border-radius:20px;padding:18px;text-align:center;box-shadow:0 8px 0 var(--navy-dunkel)}
.erfolg .haken{display:inline-block;background:var(--gruen);color:#fff;border:3px solid var(--navy-dunkel);border-radius:14px;padding:4px 18px;font-family:var(--f-titel);font-weight:900;font-size:2rem}
.code-gross{font-family:var(--f-titel);font-weight:900;font-size:4rem;letter-spacing:.25em;color:var(--navy);margin:4px 0}
.code-box{display:inline-block;border:3px dashed var(--navy-dunkel);border-radius:14px;padding:6px 18px;margin:10px 6px 0;background:#fff}

/* Fortschritt + Funk-Knopf */
.unten{position:fixed;right:16px;bottom:24px;z-index:20}
.fortschritt-zeile{display:flex;justify-content:center;margin:-4px 0 12px}
.fortschritt{display:flex;align-items:center;background:rgba(11,26,51,.8);border:3px solid var(--navy-dunkel);border-radius:30px;padding:6px 10px}
.punkt{width:38px;height:38px;border-radius:50%;border:3px solid var(--navy-dunkel);background:#9aa3ad;color:#fff;font-family:var(--f-titel);font-weight:900;display:flex;align-items:center;justify-content:center;font-size:1.2rem}
.punkt.fertig{background:var(--tuerkis)} .punkt.jetzt{background:var(--gelb);color:var(--navy-dunkel)}
.strich{width:22px;height:4px;background:#9aa3ad}
.funk-knopf{width:80px;height:80px;border-radius:50%;background:var(--gelb);border:4px solid var(--navy-dunkel);box-shadow:0 5px 0 var(--navy-dunkel);cursor:pointer;display:flex;align-items:center;justify-content:center}
.funk-knopf:active{transform:translateY(4px);box-shadow:0 1px 0 var(--navy-dunkel)}
.funk-knopf svg{width:46px;height:46px}

/* Overlays */
.overlay{position:fixed;inset:0;background:rgba(11,26,51,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.dialog{background:var(--papier);border:4px solid var(--navy-dunkel);border-radius:22px;max-width:640px;width:100%;max-height:88vh;overflow:auto;padding:18px 20px;box-shadow:0 10px 0 var(--navy-dunkel)}
.dialog h2{font-family:var(--f-titel);font-weight:900;text-transform:uppercase;margin:0 0 10px;font-size:1.8rem}
.dialog.fehler h2{color:var(--koralle)}
.beispiel{background:#fff;border-left:6px solid var(--tuerkis);padding:8px 12px;margin:10px 0;font-size:1.1rem}
.tabs{display:flex;gap:8px;margin-bottom:10px}
.tab{flex:1;padding:10px;border:3px solid var(--navy-dunkel);border-radius:12px;background:#fff;font-family:var(--f-titel);font-weight:900;font-size:1.1rem;cursor:pointer}
.tab.an{background:var(--gelb)}
.satzliste{list-style:none;padding:0;margin:0}
.satzliste li{background:#fff;border:2px solid #d6ccb4;border-radius:10px;padding:8px 12px;margin:6px 0;font-size:1.15rem}
.wort-zeile{display:flex;justify-content:space-between;border-bottom:1px solid #d6ccb4;padding:6px 2px;font-size:1.05rem}

/* Alarm-Leiste */
.alarm-leiste{position:fixed;top:0;left:0;right:0;z-index:60;display:flex;align-items:center;gap:12px;padding:8px 14px;
  background:var(--koralle);color:#fff;border-bottom:4px solid var(--navy-dunkel);box-shadow:0 4px 0 rgba(0,0,0,.25);font-size:1.1rem;line-height:1.3}
.alarm-titel{font-family:var(--f-titel);font-weight:900;text-transform:uppercase;font-size:1.5rem;flex:none}
.alarm-text b{font-size:1.3rem}
.gesperrt svg.szene{outline:5px solid var(--koralle);outline-offset:-2px}

/* Briefing */
.briefing{display:grid;grid-template-columns:200px 1fr;gap:18px;align-items:center}
@media (max-width:700px){.briefing{grid-template-columns:1fr}.briefing svg{max-width:160px;margin:0 auto}}
.sprechblase{background:#fff;border:4px solid var(--navy-dunkel);border-radius:24px;padding:16px 20px;font-size:1.3rem;line-height:1.45;position:relative;box-shadow:0 6px 0 var(--navy-dunkel)}
.regeln{margin-top:16px}
.regeln li{margin:4px 0;font-size:1.1rem}

/* Zimmer / Schulhof */
svg.szene{width:100%;height:auto;display:block;border:3px solid var(--navy-dunkel);border-radius:14px;background:#fff}
.ding,.kind{cursor:pointer}
.zaehler{text-align:center;font-family:var(--f-titel);font-weight:900;font-size:1.4rem;margin-top:8px}

/* Tür */
.tuer-wrap{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;justify-content:center}
.tuer{width:170px;height:280px;background:#9c5f2c;border:4px solid var(--navy-dunkel);border-radius:8px 8px 0 0;position:relative;flex:none;
  background-image:linear-gradient(#8a5125,#8a5125),linear-gradient(#8a5125,#8a5125);background-size:120px 80px,120px 100px;background-position:21px 110px,21px 160px;background-repeat:no-repeat}
.tuer::after{content:"";position:absolute;right:16px;top:150px;width:16px;height:16px;border-radius:50%;background:var(--gelb);border:3px solid var(--navy-dunkel)}
.schild{position:absolute;left:14px;right:14px;top:26px;background:var(--papier);border:3px solid var(--navy-dunkel);border-radius:6px;text-align:center;
  font-family:var(--f-titel);font-weight:900;font-size:1.35rem;padding:8px 4px}
.tuer-rechts{flex:1;min-width:280px}
</style>
</head>

<div id="app"></div>
<footer>Agent Files · v0.1.2 · M. Aldenius</footer>

<script>
"use strict";
/* =====================================================================
   1) EINSTELLUNGEN
   ===================================================================== */
const VERSION = "v0.1.2";
/* Raten begrenzen: erlaubte Fehlversuche pro Station, danach Alarm-Sperre */
const RATEN = { zimmer: 2, kinder: 1, sperreSekunden: 30 };

// ==== GENERATOREN START ====
function hashZahl(text){ let h = 2166136261; for (let i=0;i<text.length;i++){ h ^= text.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function zufallsquelle(startzahl){
  let a = startzahl >>> 0;
  const r = function(){ a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  r.zahl = (min, max) => min + Math.floor(r() * (max - min + 1));
  r.eins = (liste) => liste[Math.floor(r() * liste.length)];
  r.mischen = (liste) => { const l = liste.slice(); for (let i=l.length-1;i>0;i--){ const j = Math.floor(r()*(i+1)); [l[i],l[j]]=[l[j],l[i]]; } return l; };
  r.ziffern = (n) => Array.from({length:n}, () => r.zahl(0,9));
  return r;
}

/* Missionsnummer: verschlüsselt Mission und Ampel.
   nummer % (3*K) = stufe*K + missionIndex   (K = Anzahl Missionen der Klasse) */
function nummerErzeugen(K, missionIndex, stufe){
  const m = 3 * K, rest = stufe * K + missionIndex;
  let n = 100 + Math.floor(Math.random() * 900);
  n = n - (n % m) + rest;
  if (n < 100) n += m;
  if (n > 999) n -= m;
  return n;
}
function nummerLesen(K, n){ const m = n % (3*K); return { stufe: Math.floor(m / K), missionIndex: m % K }; }

/* ---------- Bausteine: Rätsel erzeugen (für beide iPads gleich) ---------- */
const ERZEUGEN = {

  buchstabieren(r, stufe, st){
    return { wort: r.eins(st.woerter[stufe]) };
  },

  tuer(r, stufe, st){
    const L = st.listenLaenge[stufe];
    let namen;
    if (stufe === 2){
      const paar = r.eins(st.aehnlich);
      const rest = r.mischen(st.namen.filter(n => !paar.includes(n))).slice(0, L - 2);
      namen = r.mischen(paar.concat(rest));
    } else {
      namen = r.mischen(st.namen).slice(0, L);
    }
    const tuerName = (stufe === 2) ? r.eins(namen.filter(n => st.aehnlich.some(p => p.includes(n) && p.every(x => namen.includes(x))))) : r.eins(namen);
    const zielPw = r.eins(st.passwoerter[stufe]);
    const alle = [...new Set(st.passwoerter.flat())].filter(p => p !== zielPw);
    const andere = r.mischen(alle);
    const liste = namen.map(n => ({ name: n, pw: n === tuerName ? zielPw : andere.pop() }));
    return { tuerName, liste, passwort: zielPw };
  },

  zimmer(r, stufe, st){
    const N = st.anzahlDinge[stufe], D = st.anzahlUnterschiede[stufe];
    const dinge = r.mischen(st.dinge).slice(0, N);
    const plaetze = r.mischen(st.plaetze.map(p => p.id));
    const vorher = dinge.map((d, i) => ({ id: d.id, platz: plaetze[i], anzahl: d.anzahl ? r.eins(d.anzahl) : 1 }));
    const frei = plaetze.slice(N);
    const bewegt = r.mischen(vorher.map(v => v.id)).slice(0, D);
    const nachher = vorher.map(v => ({ ...v }));
    bewegt.forEach((id, i) => { nachher.find(v => v.id === id).platz = frei[i]; });
    return { vorher, nachher, bewegt, codeTeil: r.ziffern(2) };
  },

  kinder(r, stufe, st){
    const n = st.anzahlKinder[stufe];
    const andereAls = (liste, wert) => r.eins(liste.filter(x => x !== wert));
    const ziel = {
      g: r.eins(["boy","girl"]), haar: r.eins(st.haarfarben), shirt: r.eins(st.farben),
      kopf: r.eins(st.kopf), kopfFarbe: r.eins(st.farben), tasche: r.eins(st.farben), ziel: true
    };
    const aendern = {
      g: k => { k.g = k.g === "boy" ? "girl" : "boy"; },
      haar: k => { k.haar = andereAls(st.haarfarben, k.haar); },
      shirt: k => { k.shirt = andereAls(st.farben, k.shirt); },
      kopf: k => { k.kopf = k.kopf === "cap" ? "hat" : "cap"; },
      kopfFarbe: k => { k.kopfFarbe = andereAls(st.farben, k.kopfFarbe); }
    };
    const merkmale = Object.keys(aendern);
    const kinder = [ziel];
    let verneint = null;
    if (stufe === 2){
      verneint = andereAls(st.farben, ziel.tasche);
      kinder.push({ ...ziel, tasche: verneint, ziel: false });
    }
    let reihe = r.mischen(merkmale), i = 0;
    while (kinder.length < n){
      const k = { ...ziel, ziel: false, tasche: r.eins(st.farben) };
      if (stufe === 0){ r.mischen(merkmale).slice(0, 2).forEach(m => aendern[m](k)); }
      else { aendern[reihe[i % reihe.length]](k); i++; }
      kinder.push(k);
    }
    // Namen und Hautfarbe
    const jungen = r.mischen(st.jungen), maedchen = r.mischen(st.maedchen);
    kinder.forEach(k => { k.name = (k.g === "boy" ? jungen : maedchen).pop(); k.haut = r.zahl(0, 3); });
    // Beschreibung (Notiz des Hausmeisters)
    const sein = ziel.g === "boy" ? "His" : "Her";
    const notiz = [
      st.notizAnfang,
      ziel.g === "boy" ? "It's a boy." : "It's a girl.",
      "The " + ziel.g + "'s T-shirt is " + ziel.shirt + ".",
      sein + " hair is " + ziel.haar + ".",
      sein + " " + ziel.kopf + " is " + ziel.kopfFarbe + "."
    ];
    if (verneint) notiz.push(sein + " bag isn't " + verneint + ".");
    return { kinder: r.mischen(kinder), zielName: ziel.name, notiz, codeTeil: r.ziffern(2) };
  },

  finale(){ return {}; }
};

/* Ganze Mission erzeugen: alle Stationen + Funkcodes + Finale-Code */
function missionErzeugen(klasse, nummer){
  const daten = AGENT_FILES.klassen[klasse];
  const K = daten.missionen.length;
  const { stufe, missionIndex } = nummerLesen(K, nummer);
  const mission = daten.missionen[missionIndex];
  const stationen = mission.stationen.map((st, i) => {
    const r = zufallsquelle(hashZahl("AF|" + klasse + "|" + nummer + "|" + i));
    const raetsel = ERZEUGEN[st.baustein](r, stufe, st);
    raetsel.funkcode = r.ziffern(2);
    return { def: st, raetsel };
  });
  const codeField = [], codeHQ = [];
  stationen.forEach(s => { if (s.raetsel.codeTeil){ (s.def.loeser === "field" ? codeField : codeHQ).push(...s.raetsel.codeTeil); } });
  return { klasse, nummer, stufe, missionIndex, mission, stationen, codeField, codeHQ };
}

function alarm(tipp, fertig){
  let rest = RATEN.sperreSekunden;
  const l = html(`<div class="alarm-leiste"><div class="alarm-titel">🚨 Alarm!</div>
    <div class="alarm-text">Zu oft geraten – gesperrt für <b data-z>${rest}</b> Sek. Fragt das andere Team: <i>${tipp}</i></div></div>`);

/* Tastatur. muster = Zielwort (für die Kästchen), typ = "buchstaben" | "zahlen" */
function tastatur({ muster, laenge, typ, beiOk }){
  const box = html(`<div></div>`);
  const anzeige = html(`<div class="anzeige"></div>`);
  // Kästchen-Muster: Buchstabe = Kästchen, Leerzeichen = Lücke, Bindestrich = fest
  const zeichen = muster ? muster.split("") : Array(laenge).fill("X");
  const felder = [];
  zeichen.forEach(c => {
    if (c === " ") anzeige.appendChild(html(`<div class="luecke"></div>`));
    else if (c === "-") anzeige.appendChild(html(`<div class="feld fest">-</div>`));
    else { const f = html(`<div class="feld"></div>`); felder.push(f); anzeige.appendChild(f); }
  });
  let eingabe = [];
  const zeigen = () => felder.forEach((f, i) => { f.textContent = eingabe[i] || ""; f.classList.toggle("aktiv", i === eingabe.length); });
  const tasten = html(`<div class="tasten ${typ === "zahlen" ? "zahlen" : ""}"></div>`);
  const zeichenListe = typ === "zahlen" ? "1234567890".split("") : "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
  zeichenListe.forEach(c => {
    const t = html(`<button class="taste">${c}</button>`);
    t.onclick = () => { if (eingabe.length < felder.length){ eingabe.push(c); zeigen(); } };
    tasten.appendChild(t);
  });
  const weg = html(`<button class="taste weg" aria-label="löschen">⌫</button>`);
  weg.onclick = () => { eingabe.pop(); zeigen(); };
  const ok = html(`<button class="taste ok">OK</button>`);
  ok.onclick = () => { if (eingabe.length === felder.length) beiOk(eingabe.join(""), () => { eingabe = []; zeigen(); }); };
  tasten.appendChild(weg); tasten.appendChild(ok);
  zeigen();
  box.appendChild(anzeige); box.appendChild(tasten);
  return box;
}
const nurBuchstaben = s => s.replace(/[^A-Z]/g, "");

/* Funk-Knopf: Redemittel + Wörterhilfe */
function funkOeffnen(){
  const daten = AGENT_FILES.klassen[Z.klasse];

  o.querySelectorAll(".tab").forEach(t => t.onclick = () => {

    t.dataset.t === "s" ? zeigeSaetze() : zeigeWoerter();

function untenLeiste(){
  const n = Z.spiel.stationen.length;
  let p = "";
  for (let i=0;i<n;i++){

    p += `<div class="punkt ${kl}">${i+1}</div>`;

  const u = html(`<div class="unten"><button class="funk-knopf" aria-label="Radio">${funkSVG()}</button></div>`);

  document.body.appendChild(u);
  return html(`<div class="fortschritt-zeile"><div class="fortschritt">${p}</div></div>`);
}

function zeigeErfolg(inhalt, def, r, extra){
  const anderes = Z.rolle === "field" ? "HQ" : "den Field Agents";
  const teil = r.codeTeil ? `<div class="code-box"><div class="de">Eure Zahlen fürs Finale – merkt sie euch!</div><div class="code-gross" style="font-size:2.6rem">${r.codeTeil.join(" ")}</div></div>` : "";
  inhalt.innerHTML = "";
  inhalt.appendChild(html(`<div class="erfolg"><div class="haken">✓ Correct!</div>
    ${extra ? `<p class="hinweis">${extra}</p>` : ""}${teil}
    <div class="code-box"><div class="de">Funkcode für ${anderes}:</div><div class="code-gross">${r.funkcode.join(" ")}</div>
    <div class="hinweis">Sagt: <b>${codeSprechen(r.funkcode)}</b></div></div>
    <div class="knopfreihe"><button class="knopf">Weiter ›</button></div></div>`));
  inhalt.querySelector(".knopf").onclick = naechsteStation;
}
function naechsteStation(){
  Z.station++;
  if (Z.station >= Z.spiel.stationen.length) zeigeEnde(); else zeigeStation();
}
function zeigeEnde(){
  leeren();
  const m = Z.spiel.mission;
  const s = html(`<div style="text-align:center">
    <div class="kopf"><div class="banner">${m.titel}</div></div>
    <div class="karte" style="max-width:640px;margin:20px auto">${hamsterSVG(true)}
      <div class="titel" style="font-size:2.4rem;color:var(--gruen)">${m.ende.en}</div>
      <p class="hinweis">${m.ende.de}</p>
      <div class="knopfreihe"><button class="knopf">Neue Mission</button></div></div></div>`);
  app.appendChild(s);
  s.querySelector(".knopf").onclick = zeigeStart;
}

/* =====================================================================
   6) ANSICHTEN DER BAUSTEINE (je Rolle)
   ===================================================================== */
const ANSICHT = {

  /* ---------- Buchstabieren (Training) ---------- */
  buchstabieren: {
    field(c){ c.def.loeser === "field" ? eintippen(c) : wortZeigen(c); },
    hq(c){ c.def.loeser === "hq" ? eintippen(c) : wortZeigen(c); }
  },

  /* ---------- Station 1: Tür ---------- */
  tuer: {
    field(c){
      const w = html(`<div class="tuer-wrap"><div class="tuer"><div class="schild">${c.r.tuerName.replace(/^(MRS|MR|MS) /, "$1<br>")}</div></div>
        <div class="tuer-rechts"><div class="titel" style="font-size:1.3rem;text-align:center">Password</div><div data-t></div></div></div>`);
      w.querySelector("[data-t]").appendChild(tastatur({ muster: c.r.passwort, typ: "buchstaben", beiOk: (wert, zurueck) => {
        if (wert === nurBuchstaben(c.r.passwort)) c.geloest("The door is open!"); else erklaeren("tuer", zurueck);
      }}));
      c.inhalt.appendChild(w);
    },
    hq(c){
      const saetze = c.def.saetze[c.stufe];
      c.inhalt.appendChild(html(`<div class="zweispaltig"><div class="papier"><h3>PASSWORDS – TOP SECRET</h3>
        ${c.r.liste.map(z => `<div class="liste-zeile"><span>${z.name}</span><b>${z.pw}</b></div>`).join("")}</div>
        ${zettel(saetze)}</div>`));
    }
  },

  /* ---------- Station 2: Zimmer ---------- */
  zimmer: {
    field(c){
      const gefunden = [];
      const D = c.r.bewegt.length;
      let uebrig = RATEN.zimmer, gesperrt = false;
      const zeichnen = () => {
        c.inhalt.innerHTML = "";
        c.inhalt.appendChild(html(`<div>${zimmerSVG(c.r.nachher, c.def, c.def.beschriftet[c.stufe], gefunden)}
          <div class="zaehler">Found: ${gefunden.length} / ${D} &nbsp;·&nbsp; ${gesperrt ? "🚨 gesperrt" : versucheText(uebrig, RATEN.zimmer)}</div></div>`));
        c.inhalt.classList.toggle("gesperrt", gesperrt);
        c.inhalt.querySelectorAll(".ding").forEach(g => g.addEventListener("click", () => {
          const id = g.dataset.id;
          if (gesperrt || gefunden.includes(id)) return;
          if (c.r.bewegt.includes(id)){
            gefunden.push(id);
            if (gefunden.length === D) c.geloest(c.def.hinweisDanach.en + "<br><span class='de'>" + c.def.hinweisDanach.de + "</span>");
            else zeichnen();
          } else if (uebrig > 0){ uebrig--; zeichnen(); erklaeren("zimmer"); }
          else { gesperrt = true; zeichnen(); alarm("Is the lamp on the table? – Where is the bag?", () => { gesperrt = false; uebrig = RATEN.zimmer; zeichnen(); }); }
        }));
      };
      zeichnen();
    },
    hq(c){
      c.inhalt.appendChild(html(`<div class="zweispaltig"><div class="foto">${zimmerSVG(c.r.vorher, c.def, c.def.beschriftet[c.stufe], null)}
        <div class="foto-unter">Professor Plum's room – photo</div></div>${zettel(c.def.saetze[c.stufe])}</div>`));
    }
  },

  /* ---------- Station 3: Kinder auf dem Schulhof ---------- */
  kinder: {
    field(c){
      let gezeigt = null;
      let uebrig = RATEN.kinder, gesperrt = false;
      const zeichnen = () => {
        c.inhalt.innerHTML = "";
        c.inhalt.appendChild(html(`<div>${schulhofSVG(c.r.kinder, gezeigt)}
          <div class="zaehler">${gezeigt ? "There's a name on the bag: " + gezeigt + "<br><span class='de'>Buchstabiert HQ diesen Namen.</span>" : "Who is with Biscuit? Tap the kid. &nbsp;·&nbsp; " + (gesperrt ? "🚨 gesperrt" : versucheText(uebrig, RATEN.kinder))}</div></div>`));
        c.inhalt.classList.toggle("gesperrt", gesperrt);
        c.inhalt.querySelectorAll(".kind").forEach(g => g.addEventListener("click", () => {
          if (gezeigt || gesperrt) return;
          if (g.dataset.name === c.r.zielName){ gezeigt = c.r.zielName; zeichnen(); }
          else if (uebrig > 0){ uebrig--; zeichnen(); erklaeren("kinder"); }
          else { gesperrt = true; zeichnen(); alarm("Is it a boy or a girl? – What colour is the T-shirt?", () => { gesperrt = false; uebrig = RATEN.kinder; zeichnen(); }); }
        }));
      };
      zeichnen();
    },
    hq(c){
      const w = html(`<div class="zweispaltig"><div class="papier"><h3>${c.def.notizTitel}</h3>${c.r.notiz.map(z => `<div>${z}</div>`).join("")}</div>
        ${zettel(c.def.saetze[c.stufe])}</div>`);
      const t = html(`<div class="papier" style="margin-top:16px"><h3>Name on the bag</h3><div data-t></div></div>`);
      t.querySelector("[data-t]").appendChild(tastatur({ muster: c.r.zielName, typ: "buchstaben", beiOk: (wert, zurueck) => {
        if (wert === c.r.zielName) c.geloest("Biscuit is in " + c.r.zielName.charAt(0) + c.r.zielName.slice(1).toLowerCase() + "'s bag!");
        else erklaeren("name", zurueck);
      }}));
      c.inhalt.appendChild(w); c.inhalt.appendChild(t);
    }
  },

  /* ---------- Finale ---------- */
  finale: {
    field(c){ finaleAnsicht(c, Z.spiel.codeField); },
    hq(c){ finaleAnsicht(c, Z.spiel.codeHQ); }
  }
};

function zettel(saetze){
  return `<div class="zettel"><h4>Useful phrases:</h4><ul>${saetze.map(x => `<li>${x}</li>`).join("")}</ul></div>`;
}
function wortZeigen(c){
  const wer = c.def.loeser === "field" ? "den Field Agents" : "HQ";
  c.inhalt.appendChild(html(`<div class="zweispaltig"><div class="papier" style="text-align:center"><h3>AGENT NAME</h3>
    <div class="code-gross" style="letter-spacing:.08em;font-size:3.2rem">${c.r.wort}</div>
    <div class="de">Buchstabiert diesen Namen ${wer}.</div></div>${zettel(c.def.saetze[c.stufe])}</div>`));
}
function eintippen(c){
  const w = html(`<div><div class="titel" style="text-align:center;font-size:1.4rem">Agent name</div><div data-t></div></div>`);
  w.querySelector("[data-t]").appendChild(tastatur({ muster: c.r.wort, typ: "buchstaben", beiOk: (wert, zurueck) => {
    if (wert === nurBuchstaben(c.r.wort)) c.geloest("Hello, agent " + c.r.wort.toLowerCase() + "!"); else erklaeren("buchstabieren", zurueck);
  }}));
  c.inhalt.appendChild(w);
}
function finaleAnsicht(c, eigene){
  const ziel = Z.spiel.codeField.concat(Z.spiel.codeHQ).join("");
  const w = html(`<div style="text-align:center">${hamsterSVG(false).replace("<svg", '<svg style="width:110px"')}
    <div class="code-box"><div class="de">Eure Zahlen:</div><div class="code-gross" style="font-size:3rem">${eigene.join(" ")}</div></div>
    <p class="hinweis">Code für die Box: <b>zuerst Field Agents, dann HQ</b></p><div data-t></div></div>`);
  w.querySelector("[data-t]").appendChild(tastatur({ laenge: 4, typ: "zahlen", beiOk: (wert, zurueck) => {
    if (wert === ziel) zeigeEnde(); else erklaeren("finale", zurueck);
  }}));
  c.inhalt.appendChild(w);
}

/* Los geht's */
zeigeStart();
</script>
</body>
</html>
